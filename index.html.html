<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Críticos - Visão Executiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-color: #e2e8f0; 
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;    
            --success: #10b981;    
            --border: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; padding: 30px 20px; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); color: var(--text-main); margin: 0; min-height: 100vh; }
        .container { max-width: 1300px; margin: auto; }
        
        .header-panel { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .title-area h2 { margin: 0; font-weight: 700; color: var(--text-main); font-size: 28px; letter-spacing: -0.5px; }
        .title-area p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 15px; }

        .controls-card {
            background: var(--card-bg); padding: 20px 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.8);
        }
        .controls-group { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        
        select { 
            padding: 12px 20px; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; background-color: #f8fafc;
            color: var(--text-main); font-family: 'Inter', sans-serif; font-weight: 500; outline: none; cursor: pointer;
        }
        select:hover { border-color: var(--primary); background-color: #fff; }

        .btn-update { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Inter'; font-size: 14px; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); }
        .btn-update:hover { background: #1d4ed8; }
        
        .chart-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 24px; }
        .main-chart-wrapper { height: 450px; width: 100%; }
        .sub-charts-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        .sub-chart-wrapper { height: 320px; width: 100%; }
        
        .details-container { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); display: none; animation: fadeIn 0.5s ease-in-out; }
        .details-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .details-title-group { display: flex; align-items: center; gap: 15px; }
        .details-header h3 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-main); }
        .badge-category { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase;}
        
        .details-actions { display: flex; gap: 10px; align-items: center; }
        .btn-excel { background: var(--success); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Inter'; font-size: 13px; transition: 0.2s; }
        .btn-excel:hover { background: #059669; }
        .btn-reset { background: #e2e8f0; color: var(--text-main); border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Inter'; font-size: 13px; display: none; transition: 0.2s; }
        .btn-reset:hover { background: #cbd5e1; }

        .details-body { display: grid; grid-template-columns: 1fr; gap: 30px; }
        .status-chart-wrapper { height: 300px; display: flex; align-items: center; justify-content: center; position: relative;}
        .empty-chart-msg { text-align: center; color: #94a3b8; font-size: 14px; font-weight: 500; padding: 20px; }
        
        .table-responsive { overflow-x: auto; max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: #f8fafc; font-weight: 600; color: var(--text-muted); font-size: 13px; position: sticky; top: 0; z-index: 10;}
        td { font-size: 14px; color: var(--text-main); font-weight: 500; }
        tbody tr:hover { background-color: #f1f5f9; }
        
        .badge-status { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-padrao { background: #e2e8f0; color: #334155; }
        .badge-programado { background: #dbeafe; color: #1d4ed8; }
        .badge-producao { background: #d1fae5; color: #059669; }
        .badge-molde { background: #fef3c7; color: #d97706; }
        .badge-priorizado { background: #f3e8ff; color: #7e22ce; }
        .badge-personalizada { background: #fee2e2; color: #b91c1c; }
        .badge-aguardando { background: #f1f5f9; color: #64748b; }
        
        .text-negativo { color: #ef4444; font-weight: 700; font-size: 15px;} 

        @media (min-width: 900px) { .sub-charts-grid { grid-template-columns: 1fr 1fr; } .details-body { grid-template-columns: 350px 1fr; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <div class="title-area">
            <h2>Painel de Críticos - Visão Executiva</h2>
            <p>Sincronizado diretamente com a aba <b>Historico</b> do Google Sheets.</p>
        </div>
        
        <div class="controls-card">
            <div class="controls-group">
                <button id="btnLoadCloud" class="btn-update">↻ Atualizar Dados</button>
                <select id="monthFilter" style="display: none;">
                    <option value="all">Todos os Meses</option>
                </select>
            </div>
            <div style="font-size: 14px; color: #64748b; font-weight: 600;" id="statusText">Aguardando...</div>
        </div>
    </div>

    <div id="chartsContainer" style="display: none;">
        <div class="chart-card">
            <div class="main-chart-wrapper"><canvas id="chartTotal"></canvas></div>
        </div>
        <div class="sub-charts-grid">
            <div class="chart-card"><div class="sub-chart-wrapper"><canvas id="chartNac"></canvas></div></div>
            <div class="chart-card"><div class="sub-chart-wrapper"><canvas id="chartExp"></canvas></div></div>
        </div>
    </div>

    <div class="details-container" id="detailsContainer">
        <div class="details-header">
            <div class="details-title-group">
                <h3 id="detailsTitle">Detalhes do Dia</h3>
                <span id="detailsBadge" class="badge-category"></span>
            </div>
            <div class="details-actions">
                <button id="btnResetStatus" class="btn-reset">Ver Todos</button>
                <button id="btnExcel" class="btn-excel">Baixar Excel</button>
            </div>
        </div>
        
        <div class="details-body">
            <div class="chart-card" style="margin-bottom: 0; padding: 15px; box-shadow: none; border: 1px solid var(--border);">
                <h4 style="margin: 0 0 15px 0; font-size: 14px; color: var(--text-muted); text-align: center;">DIVISÃO DE STATUS</h4>
                <div class="status-chart-wrapper" id="statusChartWrapper">
                    <canvas id="chartStatus"></canvas>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Descrição</th>
                            <th>Qtd</th>
                            <th>Fábrica</th>
                            <th>Status (Anotação Original)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);

    const btnLoadCloud = document.getElementById('btnLoadCloud');
    const monthFilter = document.getElementById('monthFilter');
    const detailsContainer = document.getElementById('detailsContainer');
    const statusText = document.getElementById('statusText');
    const statusChartWrapper = document.getElementById('statusChartWrapper');
    const btnResetStatus = document.getElementById('btnResetStatus');
    const btnExcel = document.getElementById('btnExcel');
    
    let charts = {}; 
    let allDataRows = [];
    let currentDayFilteredRows = []; 
    let currentDisplayedRows = [];

    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/1tfHUEqA-DZ9annmvWtUz_s8vqFOBsqNFwEb-c-LFgiI/gviz/tq?tqx=out:csv&gid=1489733833";

    const chartColors = {
        "PROGRAMADO": "#3b82f6", 
        "EM PRODUÇÃO": "#10b981", 
        "MOLDE EM FERRAMENTARIA": "#f59e0b", 
        "PRIORIZADO CENTRAL": "#8b5cf6", 
        "PROGRAMAÇÃO PERSONALIZADA": "#ef4444",
        "AGUARDANDO PROGRAMAÇÃO": "#94a3b8" 
    };

    function getVal(row, keyName) {
        if (!row) return "";
        const targetKey = keyName.toLowerCase();
        for (let k in row) {
            const cleanKey = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (cleanKey === targetKey) return row[k];
        }
        return row[keyName] || "";
    }

    // TRATAMENTO DEFINITIVO DE DATA BRASILEIRA (DD/MM/YYYY) vs ESTADO-UNIDENSE
    function parseExcelDate(val) {
        if (!val) return null;
        let d = null;

        if (val instanceof Date) {
            d = val;
        } else if (typeof val === 'number') {
            d = new Date(Math.round((val - 25569) * 86400 * 1000));
        } else if (typeof val === 'string') {
            let str = val.trim();
            
            // Caso com barra (Ex: 01/09/2026 ou 01/09/2026 00:00:00)
            if (str.includes('/')) {
                let cleanStr = str.split(' ')[0];
                let parts = cleanStr.split('/');
                if (parts.length === 3) {
                    let p0 = parseInt(parts[0], 10);
                    let p1 = parseInt(parts[1], 10);
                    let p2 = parseInt(parts[2], 10);
                    if (p2 < 100) p2 += 2000;
                    
                    // Força a leitura estrita BR: P0 = DIA, P1 = MÊS, P2 = ANO
                    if (p2 >= 2020 && p1 >= 1 && p1 <= 12 && p0 >= 1 && p0 <= 31) {
                        d = new Date(p2, p1 - 1, p0);
                    }
                }
            } 
            // Caso com hífen vindo do Google Sheets (Ex: 2026-09-01T00:00:00.000Z ou 2026-09-01)
            else if (str.includes('-')) {
                let cleanStr = str.split('T')[0].split(' ')[0];
                let parts = cleanStr.split('-');
                if (parts.length === 3) {
                    let p0 = parseInt(parts[0], 10);
                    let p1 = parseInt(parts[1], 10);
                    let p2 = parseInt(parts[2], 10);
                    
                    // Se começar pelo ano (YYYY-MM-DD)
                    if (p0 >= 2020) {
                        d = new Date(p0, p1 - 1, p2);
                    } 
                    // Se for DD-MM-YYYY
                    else if (p2 >= 2020) {
                        d = new Date(p2, p1 - 1, p0);
                    }
                }
            }
        }

        if (!d || isNaN(d.getTime()) || d.getFullYear() < 2020) return null;

        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const ano = d.getFullYear();
        const mesesAbrev = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
        
        return {
            fullDate: `${ano}-${mes}-${dia}`, 
            labelDia: `${dia} ${mesesAbrev[d.getMonth()]}`,
            labelMes: `${mes}/${ano}`, 
            diaMesClassico: `${dia}/${mes}`
        };
    }

    function getChartCategory(rawStatus) {
        let st = (rawStatus || "").toString().trim();
        if (st === "" || st === "-") return "AGUARDANDO PROGRAMAÇÃO";
        let stLower = st.toLowerCase();
        if (stLower.startsWith("inicia")) return "PROGRAMADO";
        if (stLower.includes("em produção") || stLower.includes("em producao")) return "EM PRODUÇÃO";
        if (stLower.includes("molde") && stLower.includes("ferramentaria")) return "MOLDE EM FERRAMENTARIA";
        if (stLower.includes("priorizado") && stLower.includes("central")) return "PRIORIZADO CENTRAL";
        return "PROGRAMAÇÃO PERSONALIZADA"; 
    }

    async function carregarDadosPlanilha() {
        statusText.innerHTML = "Sincronizando com o Google Sheets...";
        btnLoadCloud.disabled = true;
        btnLoadCloud.style.opacity = '0.7';

        try {
            const response = await fetch(sheetCsvUrl);
            if (!response.ok) throw new Error("Falha na resposta do servidor");
            
            const csvText = await response.text();
            
            const workbook = XLSX.read(csvText, { type: 'string', cellDates: false });
            allDataRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            populateMonthFilter();
            processAndRender("all");
            
            document.getElementById('chartsContainer').style.display = 'block';
            monthFilter.style.display = 'block';
            detailsContainer.style.display = 'none'; 
            statusText.innerHTML = `<span style="color: #10b981;">&#10004; Conectado à aba Historico</span>`;
        } catch (error) {
            console.error("Erro ao puxar dados:", error);
            statusText.innerHTML = `<span style="color: #ef4444;">&#10006; Erro de Conexão. Verifique a publicação na web.</span>`;
        } finally {
            btnLoadCloud.disabled = false;
            btnLoadCloud.style.opacity = '1';
        }
    }

    window.onload = () => carregarDadosPlanilha();
    btnLoadCloud.addEventListener('click', () => carregarDadosPlanilha());

    monthFilter.addEventListener('change', (e) => {
        processAndRender(e.target.value);
        detailsContainer.style.display = 'none';
    });

    function populateMonthFilter() {
        const meses = new Set();
        allDataRows.forEach(row => {
            const parsedDate = parseExcelDate(getVal(row, 'data'));
            if(parsedDate) meses.add(parsedDate.labelMes);
        });
        monthFilter.innerHTML = '<option value="all">Todos os Meses</option>';
        Array.from(meses).sort().forEach(mes => { monthFilter.appendChild(new Option(mes, mes)); });
    }

    function processAndRender(selectedMonth) {
        const dailyData = {};
        allDataRows.forEach(row => {
            const parsedDate = parseExcelDate(getVal(row, 'data'));
            if (!parsedDate || (selectedMonth !== "all" && parsedDate.labelMes !== selectedMonth)) return;
            const key = parsedDate.fullDate;
            const desc = getVal(row, 'descricao').toString().toUpperCase();
            
            if (!dailyData[key]) {
                dailyData[key] = { label: parsedDate.labelDia, diaMesClassico: parsedDate.diaMesClassico, fullDate: key, total: 0, nac: 0, exp: 0 };
            }
            dailyData[key].total++;
            if (desc.includes('EXP') || desc.includes('AR')) { dailyData[key].exp++; } else { dailyData[key].nac++; }
        });

        const sortedKeys = Object.keys(dailyData).sort();
        const labels = sortedKeys.map(k => dailyData[k].label);
        const diasClassicos = sortedKeys.map(k => dailyData[k].diaMesClassico);
        const fullDates = sortedKeys.map(k => dailyData[k].fullDate); 
        
        renderChart('chartTotal', 'PAINEL DE EVOLUÇÃO GERAL DE CRÍTICOS', labels, sortedKeys.map(k => dailyData[k].total), fullDates, diasClassicos, 'total', '37, 99, 235');
        renderChart('chartNac', 'EVOLUÇÃO NACIONAIS', labels, sortedKeys.map(k => dailyData[k].nac), fullDates, diasClassicos, 'nac', '16, 185, 129');
        renderChart('chartExp', 'EVOLUÇÃO EXPORTAÇÃO (EXP/AR)', labels, sortedKeys.map(k => dailyData[k].exp), fullDates, diasClassicos, 'exp', '245, 158, 11');
    }

    function renderChart(canvasId, title, labels, data, fullDates, diasClassicos, category, rgbColor) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if(charts[canvasId]) charts[canvasId].destroy();
        
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, `rgba(${rgbColor}, 0.5)`);
        gradient.addColorStop(1, `rgba(${rgbColor}, 0.0)`);
        const mainColor = `rgb(${rgbColor})`;

        charts[canvasId] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: data, borderColor: mainColor, backgroundColor: gradient, 
                    borderWidth: 4, fill: true, tension: 0.4, 
                    pointBackgroundColor: '#ffffff', pointBorderColor: mainColor, 
                    pointBorderWidth: 3, pointRadius: 6, pointHoverRadius: 9
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                layout: { padding: { top: 40, left: 10, right: 20 } },
                onHover: (e, el) => e.native.target.style.cursor = el[0] ? 'pointer' : 'default',
                onClick: (e, elements) => {
                    if (elements.length > 0) showDetails(fullDates[elements[0].index], diasClassicos[elements[0].index], category, title, mainColor);
                },
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: title, font: { size: category === 'total' ? 20 : 16, family: 'Inter', weight: '800' }, color: '#1e293b', align: 'start', padding: { bottom: 30 } },
                    datalabels: {
                        anchor: 'end', align: 'end', offset: 6, backgroundColor: '#ffffff', borderColor: '#e2e8f0',
                        borderWidth: 1, borderRadius: 8, color: '#1e293b', font: { weight: '700', family: 'Inter', size: 12 },
                        padding: { top: 4, bottom: 4, left: 8, right: 8 }, formatter: val => val > 0 ? val : ''
                    }
                },
                scales: {
                    y: { min: 0, beginAtZero: true, grid: { color: '#f1f5f9' }, border: { display: false }, ticks: { stepSize: 1, color: '#94a3b8' } },
                    x: { grid: { display: false }, border: { display: false }, ticks: { color: '#64748b', font: { size: 11, weight: '600'} } }
                }
            }
        });
    }

    function renderTable(dataArray) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";
        
        dataArray.forEach(row => {
            let originalStatus = (getVal(row, 'status') || "").toString().trim();
            if (originalStatus === "" || originalStatus === "-") originalStatus = "-";
            
            let chartCategory = getChartCategory(originalStatus);
            
            let badgeClass = "badge-status badge-padrao";
            if (chartCategory === "PROGRAMADO") badgeClass = "badge-status badge-programado";
            else if (chartCategory === "EM PRODUÇÃO") badgeClass = "badge-status badge-producao";
            else if (chartCategory === "MOLDE EM FERRAMENTARIA") badgeClass = "badge-status badge-molde";
            else if (chartCategory === "PRIORIZADO CENTRAL") badgeClass = "badge-status badge-priorizado";
            else if (chartCategory === "PROGRAMAÇÃO PERSONALIZADA") badgeClass = "badge-status badge-personalizada";
            else if (chartCategory === "AGUARDANDO PROGRAMAÇÃO") badgeClass = "badge-status badge-aguardando";

            let textoExibicao = originalStatus === "-" ? "Aguardando Programação" : originalStatus;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${getVal(row, 'item') || "-"}</strong></td>
                <td style="max-width: 250px; white-space: normal;">${getVal(row, 'descricao') || "-"}</td>
                <td class="text-negativo">${getVal(row, 'negativo') || "0"}</td>
                <td>${getVal(row, 'fabrica') || "-"}</td>
                <td><span class="${badgeClass}">${textoExibicao}</span></td>
            `;
            tableBody.appendChild(tr);
        });

        if(dataArray.length === 0) tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">Nenhum item encontrado.</td></tr>`;
    }

    function renderStatusChart() {
        const statusCounts = {};
        let hasData = false;

        currentDayFilteredRows.forEach(row => {
            let category = getChartCategory(getVal(row, 'status'));
            statusCounts[category] = (statusCounts[category] || 0) + 1;
            hasData = true;
        });

        if(charts['chartStatus']) charts['chartStatus'].destroy();
        
        if (!hasData) {
            statusChartWrapper.innerHTML = `<div class="empty-chart-msg">Nenhum dado disponível.</div><canvas id="chartStatus" style="display:none;"></canvas>`;
            return;
        } else {
            statusChartWrapper.innerHTML = `<canvas id="chartStatus"></canvas>`;
        }

        const labels = Object.keys(statusCounts);
        const dataValues = Object.values(statusCounts);
        const bgColors = labels.map(label => chartColors[label] || "#94a3b8");

        const ctx = document.getElementById('chartStatus').getContext('2d');
        charts['chartStatus'] = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{ data: dataValues, backgroundColor: bgColors, borderWidth: 2, borderColor: '#ffffff' }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '65%',
                onHover: (e, el) => e.native.target.style.cursor = el[0] ? 'pointer' : 'default',
                onClick: (e, elements) => {
                    if (elements.length > 0) {
                        const clickedLabel = charts['chartStatus'].data.labels[elements[0].index];
                        currentDisplayedRows = currentDayFilteredRows.filter(row => getChartCategory(getVal(row, 'status')) === clickedLabel);
                        renderTable(currentDisplayedRows);
                        btnResetStatus.style.display = 'block'; 
                    }
                },
                plugins: {
                    legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11 }, usePointStyle: true, padding: 15 } },
                    datalabels: { color: '#fff', font: { weight: 'bold', family: 'Inter' }, formatter: val => val }
                }
            }
        });
    }

    function showDetails(fullDate, labelDia, category, chartTitle, mainColor) {
        document.getElementById('detailsTitle').innerHTML = `Itens Críticos - <b>${labelDia}</b>`;
        const badge = document.getElementById('detailsBadge');
        badge.innerText = chartTitle.replace("PAINEL DE EVOLUÇÃO GERAL DE CRÍTICOS", "GERAL").replace("EVOLUÇÃO ", "");
        badge.style.backgroundColor = mainColor; badge.style.color = '#ffffff';

        const filteredRows = allDataRows.filter(row => {
            const parsedDate = parseExcelDate(getVal(row, 'data'));
            if (!parsedDate || parsedDate.fullDate !== fullDate) return false;
            const desc = getVal(row, 'descricao').toString().toUpperCase();
            const isExp = desc.includes('EXP') || desc.includes('AR');
            if (category === 'exp' && !isExp) return false;
            if (category === 'nac' && isExp) return false;
            return true;
        });

        currentDayFilteredRows = filteredRows;
        currentDisplayedRows = filteredRows;
        btnResetStatus.style.display = 'none';

        renderStatusChart();
        renderTable(currentDisplayedRows);

        detailsContainer.style.display = 'block';
        detailsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    btnResetStatus.addEventListener('click', () => {
        currentDisplayedRows = currentDayFilteredRows;
        renderTable(currentDisplayedRows);
        btnResetStatus.style.display = 'none';
    });

    btnExcel.addEventListener('click', () => {
        if (currentDisplayedRows.length === 0) return;
        
        const exportData = currentDisplayedRows.map(row => {
            let originalStatus = (getVal(row, 'status') || "").toString().trim();
            if (originalStatus === "" || originalStatus === "-") originalStatus = "Aguardando Programação";

            return {
                "Item": getVal(row, 'item') || "-",
                "Descrição": getVal(row, 'descricao') || "-",
                "Fábrica": getVal(row, 'fabrica') || "-",
                "Quantidade (Negativo)": getVal(row, 'negativo') || 0,
                "Status (Original)": originalStatus,
                "Categoria (Agrupamento)": getChartCategory(getVal(row, 'status'))
            };
        });
        
        const worksheet = XLSX.utils.json_to_sheet(exportData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Críticos");
        
        const categoria = document.getElementById('detailsBadge').innerText;
        const dataTexto = document.getElementById('detailsTitle').innerText.split('- ')[1].replace(/<[^>]*>?/gm, '').trim().replace('/', '_');
        XLSX.writeFile(workbook, `Criticos_${categoria}_${dataTexto}.xlsx`);
    });
</script>

</body>
</html>
