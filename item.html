<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Busca de Item - Visão Histórica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    
    <style>
        :root {
            --bg-color: #e2e8f0; 
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;    
            --success: #10b981;    
            --border: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; padding: 30px 20px; background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); color: var(--text-main); margin: 0; min-height: 100vh; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-panel { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        .title-area h2 { margin: 0; font-weight: 700; color: var(--text-main); font-size: 28px; letter-spacing: -0.5px; }
        .title-area p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 15px; }

        .controls-card {
            background: var(--card-bg); padding: 20px 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            display: flex; gap: 15px; align-items: center; border: 1px solid rgba(255,255,255,0.8); flex-wrap: wrap;
        }

        .search-input {
            flex: 1; min-width: 250px; padding: 14px 20px; font-size: 15px; border: 1px solid var(--border); 
            border-radius: 10px; background-color: #f8fafc; color: var(--text-main); font-family: 'Inter'; outline: none;
        }
        .search-input:focus { border-color: var(--primary); background-color: #fff; }

        .btn-action { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Inter'; font-size: 15px; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3); white-space: nowrap; }
        .btn-action:hover { background: #1d4ed8; }
        .btn-action:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .btn-back { background: #e2e8f0; color: var(--text-main); text-decoration: none; padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 15px; transition: 0.2s; white-space: nowrap; }
        .btn-back:hover { background: #cbd5e1; }

        .results-container { display: none; animation: fadeIn 0.5s ease-in-out; }
        .item-header { background: var(--card-bg); padding: 25px; border-radius: 20px 20px 0 0; border: 1px solid rgba(255,255,255,0.8); border-bottom: none; }
        .item-title { font-size: 24px; font-weight: 800; margin: 0 0 5px 0; color: var(--text-main); }
        .item-subtitle { font-size: 15px; color: var(--text-muted); margin: 0; }

        .chart-card { background: var(--card-bg); padding: 25px; border-radius: 0 0 20px 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 24px; }
        .main-chart-wrapper { height: 400px; width: 100%; }

        .table-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); }
        .table-responsive { overflow-x: auto; max-height: 500px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: #f8fafc; font-weight: 600; color: var(--text-muted); font-size: 13px; position: sticky; top: 0; z-index: 10;}
        td { font-size: 14px; color: var(--text-main); font-weight: 500; }
        tbody tr:hover { background-color: #f1f5f9; }
        
        .badge-status { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-padrao { background: #e2e8f0; color: #334155; }
        .badge-programado { background: #dbeafe; color: #1d4ed8; }
        .badge-producao { background: #d1fae5; color: #059669; }
        .badge-molde { background: #fef3c7; color: #d97706; }
        .badge-priorizado { background: #f3e8ff; color: #7e22ce; }
        .badge-personalizada { background: #fee2e2; color: #b91c1c; }
        .badge-aguardando { background: #f1f5f9; color: #64748b; }
        
        .text-negativo { color: #ef4444; font-weight: 700; font-size: 15px;} 

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-legend { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; justify-content: center; font-size: 12px; font-weight: 600; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <div class="title-area">
            <h2>Histórico por Item</h2>
            <p>Consulte a evolução de um item específico na base de críticos.</p>
        </div>
        
        <div class="controls-card">
            <a href="index.html" class="btn-back">⬅ Voltar</a>
            <input type="text" id="searchInput" class="search-input" placeholder="Digite o código do item (ex: 12345)..." autocomplete="off">
            <button id="btnSearch" class="btn-action" disabled>Carregando Base...</button>
        </div>
    </div>

    <div id="loadingMsg" style="display:none; text-align:center; padding: 40px; color: var(--text-muted); font-weight: 600;">
        Buscando histórico na nuvem...
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="item-header">
            <h3 class="item-title" id="displayItemCode">Item 00000</h3>
            <p class="item-subtitle" id="displayItemDesc">Descrição do Item</p>
        </div>
        <div class="chart-card">
            <h4 style="margin: 0 0 15px 0; font-size: 14px; color: var(--text-muted);">EVOLUÇÃO DA QUANTIDADE NEGATIVA (Cores = Status)</h4>
            <div class="main-chart-wrapper"><canvas id="chartHistory"></canvas></div>
            <div class="status-legend" id="legendContainer"></div>
        </div>

        <div class="table-card">
            <h4 style="margin: 0 0 15px 0; font-size: 14px; color: var(--text-muted);">LINHA DO TEMPO DETALHADA</h4>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Qtd Negativo</th>
                            <th>Fábrica</th>
                            <th>Status (Anotação)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);

    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/1tfHUEqA-DZ9annmvWtUz_s8vqFOBsqNFwEb-c-LFgiI/gviz/tq?tqx=out:csv&gid=1489733833";
    let allDataRows = [];
    let historyChart = null;

    const searchInput = document.getElementById('searchInput');
    const btnSearch = document.getElementById('btnSearch');
    const resultsContainer = document.getElementById('resultsContainer');
    const loadingMsg = document.getElementById('loadingMsg');

    const chartColors = {
        "PROGRAMADO": "#3b82f6", 
        "EM PRODUÇÃO": "#10b981", 
        "MOLDE EM FERRAMENTARIA": "#f59e0b", 
        "PRIORIZADO CENTRAL": "#8b5cf6", 
        "PROGRAMAÇÃO PERSONALIZADA": "#ef4444",
        "AGUARDANDO PROGRAMAÇÃO": "#94a3b8" 
    };

    function getVal(row, keyName) {
        if (!row) return "";
        const targetKey = keyName.toLowerCase();
        for (let k in row) {
            const cleanKey = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (cleanKey === targetKey) return row[k];
        }
        return row[keyName] || "";
    }

    function parseExcelDate(val) {
        if (!val) return null;
        let d = null;
        if (val instanceof Date) { d = val; } 
        else if (typeof val === 'number') { d = new Date(Math.round((val - 25569) * 86400 * 1000)); } 
        else if (typeof val === 'string') {
            let str = val.trim();
            if (str.includes('T') || (str.includes('-') && str.split('-')[0].length === 4)) {
                let parsedStr = new Date(str);
                if (!isNaN(parsedStr.getTime())) { d = new Date(parsedStr.getUTCFullYear(), parsedStr.getUTCMonth(), parsedStr.getUTCDate()); }
            } 
            else if (str.includes('/')) {
                let cleanStr = str.split(' ')[0]; let parts = cleanStr.split('/');
                if (parts.length === 3) {
                    let p0 = parseInt(parts[0], 10); let p1 = parseInt(parts[1], 10); let p2 = parseInt(parts[2], 10);
                    if (p2 < 100) p2 += 2000;
                    if (p2 > 2000 && p1 >= 1 && p1 <= 12 && p0 >= 1 && p0 <= 31) { d = new Date(p2, p1 - 1, p0); }
                }
            }
        }
        if (!d || isNaN(d.getTime()) || d.getFullYear() < 2020) return null;
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        return {
            rawDate: d,
            diaMesClassico: `${dia}/${mes}`,
            fullDate: `${d.getFullYear()}-${mes}-${dia}`
        };
    }

    function getChartCategory(rawStatus) {
        let st = (rawStatus || "").toString().trim();
        if (st === "" || st === "-") return "AGUARDANDO PROGRAMAÇÃO";
        let stLower = st.toLowerCase();
        if (stLower.startsWith("inicia")) return "PROGRAMADO";
        if (stLower.includes("em produção") || stLower.includes("em producao")) return "EM PRODUÇÃO";
        if (stLower.includes("molde") && stLower.includes("ferramentaria")) return "MOLDE EM FERRAMENTARIA";
        if (stLower.includes("priorizado") && stLower.includes("central")) return "PRIORIZADO CENTRAL";
        return "PROGRAMAÇÃO PERSONALIZADA"; 
    }

    async function loadData() {
        try {
            const response = await fetch(sheetCsvUrl);
            const csvText = await response.text();
            const workbook = XLSX.read(csvText, { type: 'string', cellDates: true });
            allDataRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            btnSearch.disabled = false;
            btnSearch.innerText = "🔍 Buscar";
            searchInput.focus();
        } catch (error) {
            btnSearch.innerText = "Erro ao Carregar";
        }
    }

    function renderLegend() {
        const container = document.getElementById('legendContainer');
        container.innerHTML = "";
        Object.keys(chartColors).forEach(key => {
            container.innerHTML += `
                <div class="legend-item">
                    <div class="legend-dot" style="background-color: ${chartColors[key]}"></div>
                    <span>${key}</span>
                </div>
            `;
        });
    }

    function performSearch() {
        const term = searchInput.value.trim().toUpperCase();
        if (!term) return;

        resultsContainer.style.display = 'none';
        loadingMsg.style.display = 'block';

        setTimeout(() => {
            let itemData = [];
            let itemDesc = "";

            allDataRows.forEach(row => {
                const itemCode = (getVal(row, 'item') || "").toString().toUpperCase();
                if (itemCode === term || itemCode.includes(term)) {
                    const parsedDate = parseExcelDate(getVal(row, 'data'));
                    if (parsedDate) {
                        if(!itemDesc) itemDesc = getVal(row, 'descricao') || "Sem descrição";
                        
                        // Garante que o valor negativo seja um número (remove letras/espaços se houver e converte)
                        let negVal = parseFloat((getVal(row, 'negativo') || "0").toString().replace(',', '.').replace(/[^0-9.-]+/g,""));
                        if(isNaN(negVal)) negVal = 0;

                        itemData.push({
                            dateObj: parsedDate,
                            negativo: Math.abs(negVal), // Usando abs para manter o gráfico positivo/fácil de ler, ajuste se necessário
                            fabrica: getVal(row, 'fabrica') || "-",
                            statusRaw: getVal(row, 'status') || "-",
                            statusCategory: getChartCategory(getVal(row, 'status'))
                        });
                    }
                }
            });

            if (itemData.length === 0) {
                loadingMsg.innerHTML = `<span style="color:#ef4444;">Nenhum registro encontrado para o item "${term}".</span>`;
                return;
            }

            // Ordena cronologicamente
            itemData.sort((a, b) => a.dateObj.rawDate - b.dateObj.rawDate);

            document.getElementById('displayItemCode').innerText = `Item ${term}`;
            document.getElementById('displayItemDesc').innerText = itemDesc;

            buildChart(itemData);
            buildTable(itemData);

            loadingMsg.style.display = 'none';
            resultsContainer.style.display = 'block';
            renderLegend();
        }, 300);
    }

    function buildChart(data) {
        const ctx = document.getElementById('chartHistory').getContext('2d');
        if (historyChart) historyChart.destroy();

        const labels = data.map(d => d.dateObj.diaMesClassico);
        const values = data.map(d => d.negativo);
        const pointColors = data.map(d => chartColors[d.statusCategory]);

        historyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    borderColor: '#94a3b8',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.2,
                    pointBackgroundColor: pointColors,
                    pointBorderColor: '#ffffff',
                    pointBorderWidth: 2,
                    pointRadius: 7,
                    pointHoverRadius: 10
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                layout: { padding: { top: 30, bottom: 10, left: 10, right: 20 } },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        anchor: 'end', align: 'top', offset: 4, color: '#475569',
                        font: { weight: '700', family: 'Inter', size: 11 },
                        formatter: val => val > 0 ? val : ''
                    },
                    tooltip: {
                        callbacks: {
                            label: (context) => {
                                const idx = context.dataIndex;
                                return `Qtd: ${data[idx].negativo} | Status: ${data[idx].statusCategory}`;
                            }
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' }, border: { display: false } },
                    x: { grid: { display: false }, border: { display: false }, ticks: { color: '#64748b', font: { size: 11, weight: '600'} } }
                }
            }
        });
    }

    function buildTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        // Inverte para a tabela mostrar do mais recente para o mais antigo (opcional, costuma ser melhor para leitura)
        const reversedData = [...data].reverse();

        reversedData.forEach(row => {
            let badgeClass = "badge-status badge-padrao";
            if (row.statusCategory === "PROGRAMADO") badgeClass = "badge-status badge-programado";
            else if (row.statusCategory === "EM PRODUÇÃO") badgeClass = "badge-status badge-producao";
            else if (row.statusCategory === "MOLDE EM FERRAMENTARIA") badgeClass = "badge-status badge-molde";
            else if (row.statusCategory === "PRIORIZADO CENTRAL") badgeClass = "badge-status badge-priorizado";
            else if (row.statusCategory === "PROGRAMAÇÃO PERSONALIZADA") badgeClass = "badge-status badge-personalizada";
            else if (row.statusCategory === "AGUARDANDO PROGRAMAÇÃO") badgeClass = "badge-status badge-aguardando";

            let txtStatus = row.statusRaw === "-" || row.statusRaw === "" ? "Aguardando Programação" : row.statusRaw;

            tbody.innerHTML += `
                <tr>
                    <td><strong>${row.dateObj.diaMesClassico}</strong> <span style="font-size:11px; color:#94a3b8">${row.dateObj.fullDate.split('-')[0]}</span></td>
                    <td class="text-negativo">${row.negativo}</td>
                    <td>${row.fabrica}</td>
                    <td><span class="${badgeClass}">${txtStatus}</span></td>
                </tr>
            `;
        });
    }

    window.onload = () => loadData();
    btnSearch.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter' && !btnSearch.disabled) performSearch(); });

</script>
</body>
</html>
